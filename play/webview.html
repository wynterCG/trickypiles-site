<!doctype html>
<!-- Shown by Capacitor (server.errorPath) when Android System WebView is older than 111. It cannot
     reach the app or its plugins, so it is plain HTML; colors copy tokens.css (--bg, --ink, --accent). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tricky Piles</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f6f1ea;
        color: #2b2433;
        font-family: sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 12px;
      }
      p {
        font-size: 17px;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        padding: 14px 24px;
        border-radius: 999px;
        background: #3a1d8f;
        color: #fffdf9;
        font-weight: bold;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tricky Piles</h1>
      <p>
        This game needs a newer Android System WebView. Update it in Google Play, then open the game
        again.
      </p>
      <a href="market://details?id=com.google.android.webview">Update WebView</a>
    </main>
  </body>
</html>
